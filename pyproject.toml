[project]
name = "tiny-lightning-hydra-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "lightning>=2.6.5",
    "pandas>=2.3.3",
    "torch>=2.12.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "timm>=1.0.28",
    "diffusers>=0.39.0",
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
    "scipy>=1.15.3",
    "accelerate>=1.15.0",
]

[dependency-groups]
dev = [
    "hydra-core>=1.3.5",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "pre-commit>=4.6.1",
    "rich>=15.0.0",
    "rootutils>=1.0.7",
    "ruff>=0.16.1",
    "wandb>=0.28.1",
]

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "SIM", # simplifications
    "PIE", # misc improvements
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.uv]
exclude-newer = "7 days"

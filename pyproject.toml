[project]
name = "tiny-lightning-hydra-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "lightning==2.6.6",
    "torch==2.14.1",
    "torchmetrics==1.9.0",
    "torchvision==0.29.1",
    "timm==1.0.30",
]

[dependency-groups]
dev = [
    "hydra-core==1.3.7",
    "ipykernel==7.3.0",
    "ipywidgets==8.1.9",
    "mlflow-skinny==3.17.1",
    "pre-commit==4.6.2",
    "rich==15.0.0",
    "rootutils==1.0.7",
    "ruff==0.16.1",
    "wandb==0.31.0",
]

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "SIM", # simplifications
    "PIE", # misc improvements
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.uv]
exclude-newer = "7 days"

_target_: src.models.classifier.ClassifierLightningModule

num_classes: ${data.num_classes}

clf:
  _target_: timm.create_model

  model_name: resnet18
  pretrained: true
  num_classes: ${data.num_classes}

optimizer:
  _target_: torch.optim.AdamW
  _partial_: True

  lr: 1e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: True

  eta_min: 1e-6

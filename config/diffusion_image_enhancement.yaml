defaults:
  - default

  - override data: imagenet-corrupted
  - override model: diffusion_image_enhancement

name: diffusion_image_enhancement

trainer:
  limit_val_batches: 10
  limit_test_batches: 10

  # better fits to diffusion training
  check_val_every_n_epoch: null
  val_check_interval: 2_000
  max_steps: 100_000

callbacks:
  model_checkpoint:
    filename: "epoch={epoch:02d}-step={step:02d}-val_lpips={val/lpips:.4f}"
    monitor: "val/lpips"
    mode: "min"

model:
  unet:
    low_condition: True

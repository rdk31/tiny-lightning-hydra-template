defaults:
  - imagenet.yaml
  - corruption: low_resolution

train_transform:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.ToImage
    - _target_: torchvision.transforms.v2.ToDtype
      dtype:
        _target_: hydra.utils.get_object
        path: torch.float32
      scale: True
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
    - _target_: torchvision.transforms.v2.RandomCrop
      size: 224
      pad_if_needed: True

val_transform:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.ToImage
    - _target_: torchvision.transforms.v2.ToDtype
      dtype:
        _target_: hydra.utils.get_object
        path: torch.float32
      scale: True
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
    - _target_: torchvision.transforms.v2.CenterCrop
      size: 224

batch_size: 32
num_workers: 8
pin_memory: True
